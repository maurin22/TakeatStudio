<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<title>Takeat Studio</title>
	<style>
		@font-face { font-family: 'Vinila'; src: url('fonts/Vinila-Regular.otf'); font-weight: 400; font-style: normal; }
		@font-face { font-family: 'Vinila'; src: url('fonts/Vinila-Bold.otf'); font-weight: 700; font-style: normal; }
		@font-face { font-family: 'Vinila'; src: url('fonts/Vinila-ExtraBold.otf'); font-weight: 800; font-style: normal; }
		@font-face { font-family: 'Vinila'; src: url('fonts/Vinila-Black.otf'); font-weight: 900; font-style: normal; }
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; overflow: hidden; }
		body {
			background: radial-gradient(1200px 500px at 50% -10%, #2a1215, #0d0d0f 60%);
			font-family: 'Vinila', "Segoe UI", system-ui, sans-serif;
			color: #eee;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 26px;
		}
		.brand { display: flex; align-items: center; gap: 12px; }
		.brand img { width: 34px; height: 34px; object-fit: contain; }
		.brand span { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
		.brand em { font-style: normal; color: #ff5a5a; }
		p.sub { color: #9a9aa2; font-size: 13.5px; margin-top: -14px; }
		.options { display: flex; gap: 18px; }
		.opt {
			width: 220px;
			padding: 22px 20px 18px;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 255, 255, 0.12);
			border-radius: 16px;
			cursor: pointer;
			text-align: left;
			font-family: inherit;
			color: inherit;
			transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
		}
		.opt:hover { border-color: #ff5a5a; transform: translateY(-3px); background: rgba(255, 90, 90, 0.07); }
		.opt svg { width: 30px; height: 30px; stroke: #ff5a5a; fill: none; stroke-width: 1.7; margin-bottom: 12px; }
		.opt h2 { font-size: 16.5px; font-weight: 700; margin-bottom: 5px; }
		.opt h2 em { font-style: normal; color: #ff5a5a; }
		.opt p { font-size: 12.5px; color: #9a9aa2; line-height: 1.5; }
		.opt:disabled { opacity: 0.45; cursor: default; }
		.opt:disabled:hover { transform: none; border-color: rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04); }
		#status {
			display: flex;
			align-items: center;
			gap: 10px;
			color: #c6c6cc;
			font-size: 13px;
			min-height: 20px;
		}
		#status[hidden] { display: none; }
		.spin {
			width: 14px; height: 14px;
			border: 2px solid rgba(255, 255, 255, 0.18);
			border-top-color: #ff5a5a;
			border-radius: 50%;
			animation: sp 0.8s linear infinite;
			flex: none;
		}
		@keyframes sp { to { transform: rotate(360deg); } }
	</style>
</head>
<body>
	<div class="brand">
		<img src="assets/takeat-icon.png" alt="Takeat" />
		<span>Takeat <em>Studio</em></span>
	</div>
	<p class="sub">O que você vai fazer hoje?</p>
	<div class="options">
		<button class="opt" id="cam">
			<svg viewBox="0 0 24 24"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10.5l7-3.5v10l-7-3.5" stroke-linejoin="round"/></svg>
			<h2>Takeat <em>Cam</em></h2>
			<p>Transmitir ao vivo com zoom suave e cursor destacado. Meet, OBS, apresentações.</p>
		</button>
		<button class="opt" id="rec">
			<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="#ff5a5a" stroke="none"/></svg>
			<h2>Takeat <em>Rec</em></h2>
			<p>Gravar a tela e editar com auto-zoom, cursor animado, legendas e exportação.</p>
		</button>
		<button class="opt" id="map">
			<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.6"/><circle cx="18" cy="5.5" r="2.6"/><circle cx="18" cy="18.5" r="2.6"/><path d="M7.4 10.9l8-4M7.4 13.1l8 4" stroke-linecap="round"/></svg>
			<h2>Takeat <em>Map</em></h2>
			<p>Mapas mentais colaborativos com login, cursores ao vivo e IA. Abre no navegador.</p>
		</button>
	</div>
	<div id="status" hidden><span class="spin"></span><span id="status-text"></span></div>
	<script>
		const recBtn = document.getElementById('rec')
		const status = document.getElementById('status')
		const statusText = document.getElementById('status-text')

		document.getElementById('cam').addEventListener('click', () => window.launcher.launch('cam'))
		document.getElementById('map').addEventListener('click', () => window.launcher.launch('map'))
		recBtn.addEventListener('click', () => window.launcher.launch('rec'))

		// Takeat Rec é Windows-only por enquanto
		if (window.launcher.platform) {
			window.launcher.platform().then((p) => {
				if (p !== 'win32') recBtn.style.display = 'none'
			})
		}

		window.launcher.onRecState((s) => {
			if (s === 'loading') {
				recBtn.disabled = true
				status.hidden = false
				status.querySelector('.spin').style.display = ''
				statusText.textContent = 'Abrindo o Takeat Rec... a primeira abertura pode levar meio minuto'
			} else if (s === 'error') {
				recBtn.disabled = false
				status.hidden = false
				status.querySelector('.spin').style.display = 'none'
				statusText.textContent = 'O Takeat Rec não respondeu. Tenta de novo.'
			} else {
				recBtn.disabled = false
				status.hidden = true
			}
		})
	</script>
</body>
</html>
