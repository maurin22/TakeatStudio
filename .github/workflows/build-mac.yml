name: Build macOS

# Gera o instalador do Takeat Studio pra Mac (Cam + Map).
# Roda manualmente (aba Actions -> Build macOS -> Run workflow) ou ao criar
# uma tag v* (ex.: v0.3.2) — nesse caso também publica a Release com o .dmg.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# necessário pra publicar a Release com o token do próprio GitHub
permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: Empacotar (.dmg universal, Intel + Apple Silicon)
        working-directory: app
        env:
          # sem certificado de assinatura: gera app não assinado
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v7
        with:
          name: TakeatStudio-mac
          path: |
            app/release/*.dmg
          if-no-files-found: error

      # Ao publicar por tag, cria/atualiza a Release com o .dmg anexado:
      # o link fica público e qualquer pessoa baixa sem ter conta no GitHub
      - name: Publicar Release com o .dmg
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Takeat Studio ${{ github.ref_name }}
          files: app/release/*.dmg
          fail_on_unmatched_files: true
          body: |
            **Takeat Studio ${{ github.ref_name }}**

            - **Mac** (`.dmg`): Takeat Cam + Takeat Map. Universal (Intel e Apple Silicon).
            - **Windows** (`.exe`): Takeat Cam + Takeat Rec + Takeat Map.

            Primeira abertura no Mac: clique com o **botão direito** no app → **Abrir**.
            Depois, libere **Ajustes do Sistema → Privacidade e Segurança → Gravação de Tela**.
