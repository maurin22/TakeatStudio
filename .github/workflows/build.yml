name: Build instaladores (Windows + Mac)

# Monta os instaladores do Takeat Studio.
# Rodando manualmente (Actions -> Run workflow): gera os arquivos como
# artefatos pra baixar. Criando uma tag v* (ex.: v0.3.4): além disso,
# publica a Release com tudo anexado, num link público.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# necessário pra publicar a Release com o token do próprio GitHub
permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: Empacotar (.dmg pra Apple Silicon e Intel)
        working-directory: app
        env:
          # sem certificado pago da Apple: o afterPack assina ad-hoc
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac

      - name: Publicar como artefato
        uses: actions/upload-artifact@v7
        with:
          name: TakeatStudio-mac
          path: app/release/*.dmg
          if-no-files-found: error

      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Takeat Studio ${{ github.ref_name }}
          files: app/release/*.dmg
          fail_on_unmatched_files: true
          body: |
            **Takeat Studio ${{ github.ref_name }}**

            | Sistema | Arquivo |
            |---|---|
            | Windows 10/11 | `TakeatStudio-Setup-*.exe` — Cam + Rec + Map |
            | Mac com chip Apple (M1/M2/M3/M4) | `*-mac-arm64.dmg` — Cam + Map |
            | Mac com Intel | `*-mac-x64.dmg` — Cam + Map |

            Na dúvida sobre qual Mac: menu Apple → "Sobre este Mac".

            **Primeira abertura no Mac**: o macOS avisa que não pôde verificar o app.
            Vá em **Ajustes do Sistema → Privacidade e Segurança**, role até o fim e
            clique em **"Abrir Mesmo Assim"**. Depois libere **Gravação de Tela**
            pro Takeat Studio na mesma tela de Privacidade.

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # O Takeat Rec vai embutido no instalador do Studio, então ele é
      # montado primeiro. Os helpers nativos já vêm compilados no repo,
      # por isso os scripts de postinstall são dispensados aqui.
      - name: Instalar dependências do Takeat Rec
        working-directory: takeatrec
        run: npm ci --ignore-scripts

      - name: Montar o Takeat Rec
        working-directory: takeatrec
        env:
          WHISPER_RUNTIME_ALLOW_MISSING: '1'
        run: |
          npx tsc
          npx vite build --config vite.config.ts
          npm run normalize:electron-main-cjs
          npm run smoke:electron-main-cjs
          npx electron-builder --win --dir

      - name: Instalar dependências do Studio
        working-directory: app
        run: npm ci

      - name: Empacotar o instalador do Windows
        working-directory: app
        run: npx electron-builder --win

      - name: Publicar como artefato
        uses: actions/upload-artifact@v7
        with:
          name: TakeatStudio-windows
          path: app/release/*.exe
          if-no-files-found: error

      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/release/*.exe
          fail_on_unmatched_files: true
